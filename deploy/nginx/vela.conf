# Vela locations, included into the TLS server block by
# store.xchunk.org.conf. The end-to-end test (test/e2e) runs a real nginx
# with this very file, so what is tested is what is deployed.
#
# Requires an upstream named "vela" and the blobs directory of the data
# directory at /srv/vela/blobs/ (the host side of the container's /data).

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# One ID in the nginx access log and the velad log for the same request.
proxy_set_header X-Request-ID $request_id;

# add_header in a location replaces every inherited add_header, so the
# common headers are repeated in each location below.

# API: request bodies stream straight to velad (no temporary file in
# nginx), and responses are not buffered either. Long timeouts for big
# uploads and downloads.
location /api/ {
    proxy_pass http://vela;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# Everything else (index, direct URLs, signed links, theme assets) is
# decided by velad.
location / {
    proxy_pass http://vela;
    # The public side never accepts request bodies.
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# Internal only: velad answers with X-Accel-Redirect: /_blobs/<shard>/<id>
# and nginx serves the file (sendfile, Range, HEAD, ETag, Last-Modified).
# Clients requesting /_blobs/ directly get 404.
location /_blobs/ {
    internal;
    alias /srv/vela/blobs/;

    sendfile on;
    tcp_nopush on;

    # Content-Type and Content-Disposition survive the internal redirect.
    # Other upstream headers do not, so velad sends them as X-Vela-* and
    # they are re-emitted here. An empty variable adds no header, which is
    # intended: public files have no X-Robots-Tag, for example.
    add_header Cache-Control $upstream_http_x_vela_cache_control always;
    add_header X-Robots-Tag $upstream_http_x_vela_robots always;
    add_header Referrer-Policy $upstream_http_x_vela_referrer_policy always;
    add_header X-Request-ID $upstream_http_x_request_id always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}
