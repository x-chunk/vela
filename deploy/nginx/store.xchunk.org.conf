# Reference nginx configuration for store.xchunk.org.
#
# Install:
#   cp deploy/nginx/vela.conf /etc/nginx/snippets/vela.conf
#   cp deploy/nginx/store.xchunk.org.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/store.xchunk.org.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# nginx only terminates TLS, proxies to velad and streams blob files when
# velad tells it to (X-Accel-Redirect). Every decision about paths, access,
# visibility and caching is made by velad.
#
# This file is included into the http {} context (sites-enabled or
# conf.d), which is why log_format sits at the top level: nginx does not
# allow it inside a server block.

# Never log query strings: signed links carry their signatures there. Every
# server block below uses this format; nginx's default "combined" format
# would log the full request line, query included. (The error log cannot
# drop the query; vela.conf disables it for signed-link locations.)
log_format vela_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_time $request_id';

upstream vela {
    # The container publishes its port on loopback only:
    #   docker run -p 127.0.0.1:8080:8080 ...
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name store.xchunk.org;

    access_log /var/log/nginx/store.xchunk.org.access.log vela_noquery;
    error_log  /var/log/nginx/store.xchunk.org.error.log;

    # certbot --webroot -w /var/www/certbot -d store.xchunk.org
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name store.xchunk.org;
    server_tokens off;

    # TLS certificates from certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/store.xchunk.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.xchunk.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vela_ssl:10m;
    ssl_session_timeout 1d;

    # Keep in sync with VELA_MAX_UPLOAD (2GiB by default).
    client_max_body_size 2g;

    access_log /var/log/nginx/store.xchunk.org.access.log vela_noquery;
    error_log  /var/log/nginx/store.xchunk.org.error.log;

    include /etc/nginx/snippets/vela.conf;
}
