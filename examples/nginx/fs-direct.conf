# Example configuration for Vela — not a supported deployment.
# Scenario: fs-direct
# Requires: VELA_STORAGE=fs, VELA_ACCEL_PREFIX=
# Replace: store.example.com, certificate paths, /srv/vela, upstream address.
# You are responsible for securing and maintaining your reverse proxy.

# Include exactly one scenario in nginx's http context.
# Never log query strings: signed links carry their signatures there. Every
# server block below uses this format; nginx's default "combined" format
# would log the full request line, query included. (The error log cannot
# drop the query; common.conf disables it for signed-link locations.)
log_format vela_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_time $request_id';

upstream vela {
    # The container publishes its port on loopback only:
    #   docker run -p 127.0.0.1:8080:8080 ...
    # CHANGE ME: upstream address if velad runs elsewhere.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # CHANGE ME: public hostname.
    server_name store.example.com;

    access_log /var/log/nginx/vela.access.log vela_noquery;
    error_log  /var/log/nginx/vela.error.log;

    # certbot --webroot -w /var/www/certbot -d store.example.com
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # CHANGE ME: public hostname.
    server_name store.example.com;
    server_tokens off;

    # CHANGE ME: certificate paths; obtain TLS certificates using your chosen tool.
    ssl_certificate     /etc/letsencrypt/live/store.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vela_ssl:10m;
    ssl_session_timeout 1d;

    # Keep in sync with VELA_MAX_UPLOAD (2GiB by default).
    client_max_body_size 2g;

    # Uploads carry metadata in headers, percent-encoded: the longest
    # allowed description (4096 four-byte characters) is a 48 KiB header
    # line, and all metadata together stay below 64 KiB. nginx's default of
    # 8k per line would reject valid uploads with 400.
    large_client_header_buffers 4 64k;

    access_log /var/log/nginx/vela.access.log vela_noquery;
    error_log  /var/log/nginx/vela.error.log;

    include /etc/nginx/snippets/common.conf;
}
