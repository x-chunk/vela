# Example configuration for Vela — not a supported deployment.
# Scenario: fs-accel
# Requires: VELA_STORAGE=fs, VELA_ACCEL_PREFIX=/_blobs/
# Replace: store.example.com, certificate paths, /srv/vela, upstream address.
# You are responsible for securing and maintaining your reverse proxy.

# Internal only: velad answers with X-Accel-Redirect: /_blobs/<shard>/<id>
# and nginx serves the file (sendfile, Range, HEAD).
# Clients requesting /_blobs/ directly get 404.
# Use these locations only with the fs-accel scenario.
location /_blobs/ {
    internal;
    # CHANGE ME: readable host-side filesystem blobs directory.
    alias /srv/vela/blobs/;

    sendfile on;
    tcp_nopush on;

    # Validators come from velad, which answers If-None-Match itself: the
    # ETag is the content's SHA-256, while nginx's mtime-size ETag collides
    # for same-size content written within a second. nginx must not answer
    # 304 from its own validators, and Last-Modified (one-second resolution)
    # is removed, so If-Range is only ever compared with velad's ETag.
    etag off;
    if_modified_since off;
    add_header ETag $upstream_http_x_vela_etag always;
    add_header Last-Modified "" always;

    # Content-Type and Content-Disposition survive the internal redirect.
    # Other upstream headers do not, so velad sends them as X-Vela-* and
    # they are re-emitted here. An empty variable adds no header, which is
    # intended: public files have no X-Robots-Tag, for example.
    add_header Cache-Control $upstream_http_x_vela_cache_control always;
    add_header X-Robots-Tag $upstream_http_x_vela_robots always;
    add_header Referrer-Policy $upstream_http_x_vela_referrer_policy always;
    # Set only with VELA_WEB_AUTH: responses vary by session cookie, and
    # uploaded HTML/SVG/XML is sandboxed away from that cookie.
    add_header Vary $upstream_http_x_vela_vary always;
    add_header Content-Security-Policy $upstream_http_x_vela_content_security_policy always;
    add_header X-Request-ID $upstream_http_x_request_id always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# The same for signed links: velad redirects them to /_blobs/s/<shard>/<id>
# so that error logging can be off (see location /s/ above). Shard
# directories have two-character names, so "s/" never clashes with them.
location /_blobs/s/ {
    internal;
    # CHANGE ME: readable host-side filesystem blobs directory.
    alias /srv/vela/blobs/;
    error_log /dev/null;

    sendfile on;
    tcp_nopush on;

    # Validators come from velad, which answers If-None-Match itself: the
    # ETag is the content's SHA-256, while nginx's mtime-size ETag collides
    # for same-size content written within a second. nginx must not answer
    # 304 from its own validators, and Last-Modified (one-second resolution)
    # is removed, so If-Range is only ever compared with velad's ETag.
    etag off;
    if_modified_since off;
    add_header ETag $upstream_http_x_vela_etag always;
    add_header Last-Modified "" always;

    # Content-Type and Content-Disposition survive the internal redirect.
    # Other upstream headers do not, so velad sends them as X-Vela-* and
    # they are re-emitted here. An empty variable adds no header, which is
    # intended: public files have no X-Robots-Tag, for example.
    add_header Cache-Control $upstream_http_x_vela_cache_control always;
    add_header X-Robots-Tag $upstream_http_x_vela_robots always;
    add_header Referrer-Policy $upstream_http_x_vela_referrer_policy always;
    # Set only with VELA_WEB_AUTH: responses vary by session cookie, and
    # uploaded HTML/SVG/XML is sandboxed away from that cookie.
    add_header Vary $upstream_http_x_vela_vary always;
    add_header Content-Security-Policy $upstream_http_x_vela_content_security_policy always;
    add_header X-Request-ID $upstream_http_x_request_id always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}
