# Example configuration for Vela — not a supported deployment.
# Scenario: all
# Requires: an upstream named vela; direct delivery or the matching accel locations
# Replace: store.example.com, certificate paths, /srv/vela, upstream address.
# You are responsible for securing and maintaining your reverse proxy.

# R2 proxy delivery must not spill large response bodies onto the server disk.
# These inherited settings apply to public URLs, signed links, and the API.
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# One ID in the nginx access log and the velad log for the same request.
proxy_set_header X-Request-ID $request_id;

# add_header in a location replaces every inherited add_header, so the
# common headers are repeated in each location below. velad sets
# X-Content-Type-Options itself, so proxied locations hide the upstream copy
# and add their own: every response, including nginx's own error pages,
# carries the header exactly once.
proxy_hide_header X-Content-Type-Options;

# API: request bodies stream straight to velad (no temporary file in
# nginx), and responses are not buffered either. Long timeouts for big
# uploads and downloads.
location /api/ {
    proxy_pass http://vela;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# Signed links: /s/<id>/<name>?exp=...&sig=... The signature is a
# credential in the query string. The access log format omits queries, but
# nginx's error log always records the full request line (for example
# when velad is unreachable), so error logging is off here and in the
# matching internal location below. Failures of signed links are still
# visible in velad's log, which never records queries, and upstream
# outages show up on every other route.
location /s/ {
    proxy_pass http://vela;
    client_max_body_size 1k;
    error_log /dev/null;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# Everything else (index, direct URLs, theme assets) is decided by velad.
location / {
    proxy_pass http://vela;
    # The public side never accepts request bodies.
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

