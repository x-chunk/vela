name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neutrality:
    name: neutral examples and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check-neutrality
      - run: python3 scripts/test-neutrality.py
      - name: scan all Git history for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --redact --log-opts=--all .
      - name: scan current source for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir --redact .

  examples:
    name: deployment example validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck examples/docker/*.sh scripts/*.sh
      - run: make validate-examples

  test:
    name: vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: make test
      - name: go build
        run: go build ./cmd/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0
          # Built with the job's Go toolchain, so it can always read the
          # export data of the Go version in go.mod.
          install-mode: goinstall

  windows:
    name: CLI config on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The private-config guarantees use Windows DACLs, which only a
      # Windows runner can exercise.
      - name: go test
        run: go test -count=1 ./internal/cli/config/
      - name: go build
        run: go build ./cmd/vela

  e2e:
    name: nginx end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: accel delivery through nginx
        run: make test-e2e

  s3:
    name: R2 contracts and migration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test private S3 storage
        run: make test-s3

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
