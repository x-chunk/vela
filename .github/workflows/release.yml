name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: make test
      - run: make test-s3
      - run: make check-neutrality
      - run: python3 scripts/test-neutrality.py
      - name: scan all Git history for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --redact --log-opts=--all .
      - name: scan current source for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir --redact .
      - run: make validate-examples
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck examples/docker/*.sh scripts/*.sh
      - run: make test-e2e
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall

  image:
    name: publish multi-arch image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build metadata
        id: build
        # The commit date rather than "now" keeps rebuilds of a tag
        # reproducible.
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: require Docker Hub image configuration
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: test -n "$DOCKERHUB_IMAGE" || { echo "Set vars.DOCKERHUB_IMAGE to the image repository" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          labels: |
            org.opencontainers.image.title=Vela
            org.opencontainers.image.description=Self-hosted file store with a Go server and CLI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://docs.xchunk.org/vela
          # X.Y.Z, X.Y and latest (latest only for non-prerelease tags).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: GitHub Release with CLI binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; nothing else needs write access
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build archives
        run: make dist VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA}" DATE="$(git log -1 --format=%cI)"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --generate-notes --title "Vela ${GITHUB_REF_NAME}" ${prerelease}
